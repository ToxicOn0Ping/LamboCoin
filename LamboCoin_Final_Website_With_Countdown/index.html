<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lambo Coin</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      background: url('images/background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      height: 100vh;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.6);
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px;
      position: relative;
    }

    .timer {
      font-size: 2rem;
      margin-bottom: 30px;
      color: black;
      background-color: #FFA500;
      padding: 10px 25px;
      border-radius: 12px;
      font-weight: bold;
      position: absolute;
      top: 20px;
    }

    h1 {
      font-size: 4rem;
      color: #FFA500;
      letter-spacing: 8px;
      margin: 80px 0 20px;
    }

    .social-links {
      margin-top: 20px;
    }

    .social-links a {
      text-decoration: none;
      color: black;
      background: #FFA500;
      padding: 15px 30px;
      border-radius: 10px;
      margin: 10px;
      font-size: 1.2rem;
      transition: background 0.3s ease;
    }

    .social-links a:hover {
      background: #ff7300;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.5rem;
      }
      .timer {
        font-size: 1.2rem;
        padding: 8px 15px;
      }
      .social-links a {
        padding: 12px 20px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="timer" id="countdown">🚀 Countdown till launch 🚀</div>
    <h1>Lambo Coin</h1>
    <div class="social-links">
      <a href="https://bit.ly/430nKty" target="_blank">Instagram</a>
      <a href="https://t.me/TheLmboCoinLol" target="_blank">Telegram</a>
      <a href="https://www.tiktok.com/@lambo.coin" target="_blank">TikTok</a>
    </div>
  </div>

  <script>
    const countdown = document.getElementById("countdown");
    const targetDate = new Date("May 16, 2025 14:00:00").getTime();

    const updateTimer = () => {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        countdown.innerHTML = "🚀 Countdown complete! 🚀";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdown.innerHTML = `🚀 Countdown till launch: ${days}d ${hours}h ${minutes}m ${seconds}s 🚀`;
    };

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
